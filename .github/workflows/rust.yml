name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cargo check
        run: cargo check --all --all-features

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --all --all-features --verbose

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate lcov coverage
        # Ratchet, not the house 100% target. The uncovered remainder is the
        # code that only runs against a real TTY: terminal.rs's crossterm
        # impl, runtime.rs's run_interactive wiring, and lib.rs's call into
        # it. None of it can execute under `cargo test`, so the gate holds the
        # line where it actually is instead of asserting a number the suite
        # cannot reach. Measured 96.40% lines / 83.24% functions, and stable
        # to the digit across repeat runs, so these floors trip on a real
        # regression rather than on noise. Raise them when coverage rises;
        # never lower them.
        run: >-
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          --fail-under-lines 96 --fail-under-functions 83

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          codecov_yml_path: .github/codecov.yml
          fail_ci_if_error: false
